<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · webhook-relay</title>
<style>
:root { --bg:#fff; --fg:#1d2330; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --ok:#15803d; --warn:#b45309; --err:#b91c1c; --code:#f6f8fa; --ins:#e6ffec; --del:#ffebe9; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1419; --fg:#e6e8eb; --muted:#9aa4b2; --line:#2a313c; --accent:#60a5fa; --ok:#4ade80; --warn:#fbbf24; --err:#f87171; --code:#161b22; --ins:#12261e; --del:#2d1517; } }
* { box-sizing:border-box }
body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg) }
header { border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:16px; align-items:center }
header a { color:var(--fg); text-decoration:none; font-weight:600 }
main { max-width:1100px; margin:0 auto; padding:16px }
a { color:var(--accent) }
table { width:100%; border-collapse:collapse }
th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top }
th { color:var(--muted); font-weight:500; font-size:13px }
pre, code { font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace }
pre { background:var(--code); padding:12px; border-radius:6px; overflow-x:auto; margin:0 }
.badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line) }
.on { color:var(--ok); border-color:var(--ok) } .off { color:var(--muted) }
.ok { color:var(--ok) } .warn { color:var(--warn) } .err { color:var(--err) } .none { color:var(--muted) }
.muted { color:var(--muted) }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:16px } @media (max-width:800px){ .grid { grid-template-columns:1fr } }
button { font:inherit; padding:6px 14px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer }
.diff div { white-space:pre-wrap; font:13px/1.45 ui-monospace,monospace; padding:0 8px }
.diff .ins { background:var(--ins) } .diff .del { background:var(--del) }
h1 { font-size:20px } h2 { font-size:16px; margin-top:24px }
.overflow { overflow-x:auto }
</style>
</head>
<body>
<header><a href="/">webhook-relay</a><span class="muted">{{.Title}}</span></header>
<main>{{template "content" .}}</main>
</body>
</html>
